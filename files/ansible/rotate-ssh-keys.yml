---
# rotate-ssh-keys.yml
# Αλλαγή SSH key σε όλους τους servers

- name: Rotate SSH Keys
  hosts: all_managed
  tasks:

    - name: Προσθήκη νέου key
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '/home/ansible/.ssh/new_id_ed25519.pub') }}"

    - name: Αφαίρεση παλιού key
      ansible.posix.authorized_key:
        user: ansible
        state: absent
        key: "{{ lookup('file', '/home/ansible/.ssh/old_id_ed25519.pub') }}"

    - name: Επαλήθευση νέου key
      ansible.builtin.debug:
        msg: "SSH key rotated on {{ inventory_hostname }}"
