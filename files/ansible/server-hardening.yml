---
# server-hardening.yml
# Πλήρες Server Hardening Playbook
# Κεφ. 21.6 — Essential Modules
# Χρήση: ansible-playbook playbooks/server-hardening.yml --limit nextcloud --check --diff

- name: Server Hardening
  hosts: "{{ target | default('all_managed') }}"
  become: true
  gather_facts: true

  vars:
    ssh_port:     "{{ ansible_port | default(22) }}"
    admin_email:  admin@example.com
    open_ports:   [80, 443]

    sysctl_security:
      - { name: "net.ipv4.ip_forward",                value: "0" }
      - { name: "net.ipv4.conf.all.accept_redirects", value: "0" }
      - { name: "net.ipv4.conf.all.send_redirects",   value: "0" }
      - { name: "net.ipv4.tcp_syncookies",             value: "1" }
      - { name: "kernel.randomize_va_space",           value: "2" }
      - { name: "fs.suid_dumpable",                    value: "0" }

  tasks:

    - name: "🔒 SSH Hardening"
      ansible.builtin.lineinfile:
        path:   /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line:   "{{ item.line }}"
        backup: true
      loop:
        - { regexp: "^#?PermitRootLogin",        line: "PermitRootLogin no"        }
        - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
        - { regexp: "^#?X11Forwarding",          line: "X11Forwarding no"         }
        - { regexp: "^#?MaxAuthTries",           line: "MaxAuthTries 3"           }
        - { regexp: "^#?LoginGraceTime",         line: "LoginGraceTime 30"        }
        - { regexp: "^#?ClientAliveInterval",    line: "ClientAliveInterval 300"  }
        - { regexp: "^#?ClientAliveCountMax",    line: "ClientAliveCountMax 2"    }
      notify: Restart sshd

    - name: "⚙️ Kernel security parameters"
      ansible.posix.sysctl:
        name:   "{{ item.name }}"
        value:  "{{ item.value }}"
        state:  present
        reload: true
      loop: "{{ sysctl_security }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "🔥 UFW: Allow SSH (Debian)"
      community.general.ufw:
        rule:  allow
        port:  "{{ ssh_port }}"
        proto: tcp
      when: ansible_facts['os_family'] == "Debian"

    - name: "🔥 UFW: Allow services"
      community.general.ufw:
        rule:  allow
        port:  "{{ item | string }}"
        proto: tcp
      loop: "{{ open_ports }}"
      when: ansible_facts['os_family'] == "Debian"

    - name: "🔥 UFW: Enable"
      community.general.ufw:
        state:  enabled
        policy: deny
      when: ansible_facts['os_family'] == "Debian"

    - name: "🔥 firewalld: Services (RedHat)"
      ansible.posix.firewalld:
        service:   "{{ item }}"
        permanent: true
        state:     enabled
      loop: [ssh, http, https]
      when: ansible_facts['os_family'] in ["RedHat", "Suse"]
      notify: Reload firewalld

    - name: "🕐 Daily rkhunter scan"
      ansible.builtin.cron:
        name:   "Daily rkhunter scan"
        minute: "0"
        hour:   "4"
        job:    "/usr/bin/rkhunter --check --skip-keypress --report-warnings-only | mail -s 'rkhunter {{ inventory_hostname }}' {{ admin_email }}"

    - name: "📋 MOTD"
      ansible.builtin.blockinfile:
        path:   /etc/motd
        marker: "# {mark} ANSIBLE MANAGED"
        block:  |
          ╔══════════════════════════════════════════╗
          ║  {{ inventory_hostname }} — Managed by Ansible  ║
          ║  Unauthorized access is prohibited!      ║
          ╚══════════════════════════════════════════╝

    - name: "🔍 Verify SSH port"
      ansible.builtin.wait_for:
        port:    "{{ ssh_port }}"
        timeout: 10
        state:   started

    - name: "📊 Hardening Report"
      ansible.builtin.debug:
        msg:
          - "✅ SERVER HARDENING COMPLETE: {{ inventory_hostname }}"
          - "   SSH: Port {{ ssh_port }}, No root, No password"
          - "   FW: {{ 'UFW' if ansible_facts['os_family'] == 'Debian' else 'firewalld' }}"

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name:  "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
        state: restarted

    - name: Reload firewalld
      ansible.builtin.service:
        name:  firewalld
        state: reloaded
